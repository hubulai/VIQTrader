# =============================================================
# VIQTrader 参数基线（default.yaml）
# - user.yaml 覆盖本文件同名字段；机密只进 .env
# - 所有标记 [占位] 的阈值以用户在 P2 联调前提供的真实值为准
# - 任何修改产生新 config_snapshot（hash + 全量 YAML + 生效时间）
# =============================================================

platform:
  env: sim                    # v1 仅模拟盘；live 预留，禁止直接改 live
  base_currency: CNY
  data_dir: D:\Work\VIQTrader\data    # 可用 .env 的 VIQ_DATA_DIR 覆盖
  duckdb_file: viqtrader.duckdb

# ---------- 双轨资金配额（单账户双子账本） ----------
accounts:
  value:
    target_ratio: 0.8
    initial_quota_cny: 800000         # [占位] 总额待定，比例为准
  swing:
    target_ratio: 0.2
    initial_quota_cny: 200000         # [占位]

# ---------- 能力圈（价值轨负面清单，第 0 步一票否决） ----------
circle_of_competence:
  industry_whitelist: []              # 空 = 不启用白名单，仅用黑名单
  industry_blacklist: []              # [占位] 待用户给定
  stock_blacklist: []                 # [占位] 个股黑名单

# ---------- 价值轨 ----------
value_track:
  screening:                          # 质量优先排序；估值只是买入闸门
    roic_min: 0.10                    # [占位] ROIC 下限
    roic_sustain_years: 5             # [占位] ROIC 持续年限
    roe_min: 0.12                     # [占位]
    roe_sustain_years: 3              # [占位]
    max_debt_ratio: 0.60              # [占位]
    min_consecutive_profit_years: 3   # [占位]
    require_positive_fcf: true
    require_dividend_capability: true
  gate:                               # 买入闸门（便宜是闸门不是排序键）
    pe_ttm_max: 15.0                  # [占位]
    dv_ratio_min: 0.03                # [占位]
    margin_of_safety_min: 0.30        # [占位] 安全边际下限
    valuation_uncertainty_extra_discount: 0.10  # [占位] 估值越不确定要求折价越深
  position:
    max_single_pct: 0.15              # [占位] 单标的占价值轨市值上限
    max_industry_pct: 0.30            # [占位]
  discipline:
    annual_turnover_warn: 0.30        # [占位] 年换手率告警（风格漂移，不强制阻断）
  stop_loss:                          # 基本面两档止损；下跌本身永不触发卖出
    watch_events:                     # 观察档：触发告警 + thesis 复核
      - roic_below_min_2y
      - fcf_negative_2y
      - dividend_cut
    exit_events:                      # 退出档：逻辑证伪/暴雷，触发卖出流程
      - accounting_fraud
      - thesis_falsified
      - moat_broken
  watchlist:
    research_ttl_days: 90             # 研究结论保质期，过期需复核
    reverify_on_new_report: true      # 新财报发布自动触发 thesis 复核

# ---------- 波段轨 ----------
swing_track:
  position:
    max_positions: 5                  # [占位]
    max_single_pct: 0.25              # [占位]
  risk:
    price_stop_loss: -0.08            # [占位] 价格止损
    max_drawdown: -0.15               # [占位] 回撤止损
    max_holding_days: 20              # [占位] 持有期上限
  lifecycle:                          # 5 阶段：INCUBATING → PAPER → PROBATION → PRODUCTION → RETIRED
    incubating_min_is_oos: 0.7        # 孵化→纸交易：Walk-Forward IS/OOS 均值下限（硬门禁）
    paper_min_days: 20                # [占位] 纸交易最短天数
    paper_min_return: 0.0             # 纸交易→试用：累计收益下限（>0）
    paper_max_drawdown: -0.05         # 纸交易→试用：最大回撤上限（>-5%）
    probation_capital_pct: 0.05       # 试用资金占波段子账本比例（设计 5~10% 取下限）
    probation_to_production_min_sharpe: 1.0   # 试用→主力：近 1 月 Sharpe（2026-10-16 裁决覆盖设计 0.5）
    production_min_sharpe: 1.0        # 主力保持：滚动 30 日 Sharpe（跌破降级回试用）
    production_max_drawdown: -0.15    # 主力保持：滚动回撤上限（跌穿降级回试用）
    production_capital_pct: 0.30      # 主力资金占波段子账本比例（设计 30~50% 取下限）
    retire_sharpe: 0.3                # 退役：滚动 30 日 Sharpe 低于此值
    retire_duration_days: 14          # 退役：低 Sharpe 持续自然日天数
    retire_daily_loss: -0.05          # 退役：单日亏损立即触发（2026-10-16 裁决覆盖设计 -3%）
    # 注：胜率/盈亏比由 P3.4 波段回测输出展示，不作为生命周期门槛（2026-10-16 裁决）
  walk_forward:
    is_days: 250                      # [占位] 样本内窗口
    oos_days: 60                      # [占位] 样本外窗口
    min_oos_is_ratio: 0.7             # 硬门禁：低于禁止进入 paper

# ---------- 港股通规则 ----------
hk_connect:
  dividend_tax_h_share: 0.20          # H股红利税
  dividend_tax_red_chip: 0.28         # 红筹股红利税
  out_of_list_sell_only: true         # 调出名单后只能卖不能买（交易所规则）

# ---------- 费用模型（模拟撮合） ----------
fees:
  a_share:
    commission_rate: 0.00025          # [占位] 佣金（双边）
    commission_min_cny: 5
    stamp_tax_sell: 0.0005            # 印花税（卖出单边）
    transfer_fee: 0.00001             # 过户费（双边）
  hk_connect:
    commission_rate: 0.0003           # [占位]
    commission_min_hkd: 5
    stamp_tax_bilateral: 0.001        # 印花税（双边）
    trading_fee: 0.0000565            # 交易费+征费等合并占位
  slippage_bps: 10                    # [占位] 模拟滑点（基点）

# ---------- 交易规则 ----------
trading:
  a_share_t_plus_1: true              # A股 T+1
  hk_connect_t_plus_0: true           # 港股通 T+0
  limit_up_down_block: true           # 涨跌停不可成交
  price_limit:                        # 涨跌幅按板块
    main_normal: 0.10                 # 主板
    main_st: 0.05                     # 主板 ST
    chinext: 0.20                     # 创业板
    star: 0.20                        # 科创板
    bse: 0.30                         # 北交所
  lot_size:                           # 手数按板块
    main: 100                         # 主板/创业板/北交所整百
    star_min: 200                     # 科创板最小申报
    hk_default: 1                     # [占位] 港股通 v1 简化为 1
  drift_tolerance: 0.05               # 双轨配额告警阈值（软限制，只告警不阻断）

# ---------- 告警分级路由 ----------
alerting:
  info_aggregate_minutes: 30          # INFO 聚合推送间隔
  channels:
    info: [console]
    warn: [console]
    critical: [console]               # [占位] 后续接多渠道
    fatal: [console]                  # FATAL 同时触发引擎暂停
  fatal_pause_engine: true

# ---------- 数据源 ----------
data:
  qmt:
    enabled: true
    # install_dir 由 .env 的 QMT_INSTALL_DIR 提供
    financial_tables: [Balance, Income, CashFlow, PershareIndex, Capital]
    financial_report_type: report_time  # 实测：必须为 report_time 且用异步接口
  tushare:
    enabled: false                    # P1 默认 AkShare，token 就绪后切换
    token_env: TUSHARE_TOKEN
  akshare:
    enabled: true
  fx_pair: HKD/CNY
  sync:
    lookback_days_on_gap: 10          # 增量同步缺口回补窗口
    financial_lookback_years: 3       # 财务/分红默认回拉年数
    daily_lookback_days: 365          # 日线默认回拉天数（全新标的）
    quality_check_null_warn_threshold: 0.30  # null 比例告警阈值（30%）
  valuation:
    pe_percentile_window_days: 250     # PE 历史分位滚动窗口（交易日）
    pe_percentile_min_samples: 60      # 窗口内最小有效样本，低于则留空
  golden:                              # P1.7 黄金数据集
    dir: tests/golden
    start_date: "2022-01-01"
    end_date: "2024-12-31"
    symbols:
      - { market: SH, code: "600519", name: 贵州茅台, style: value }
      - { market: SH, code: "600900", name: 长江电力, style: value }
      - { market: SH, code: "601088", name: 中国神华, style: value }
      - { market: SZ, code: "000858", name: 五粮液,   style: value }
      - { market: SZ, code: "300750", name: 宁德时代, style: swing }
      - { market: SZ, code: "002594", name: 比亚迪,   style: swing }
      - { market: HK, code: "00700",  name: 腾讯控股, style: hk_connect }
      - { market: HK, code: "03690",  name: 美团-W,   style: hk_connect }

# ---------- 自我学习 ----------
learning:
  outcome_horizon_days: [30, 180, 365, 1095]   # 1月/6月/1年/3年 结果回填
  case_retrieval_top_k: 5
  scorecard_window: 20                # 评分卡滚动窗口（最近 N 次决策）

# ---------- 归因 ----------
attribution:
  brinson:
    benchmark: csi300                 # [占位] 基准指数
    rebalance_freq: monthly

# ---------- 研报文档库 ----------
documents:
  inbox_dir: D:\Work\VIQTrader\data\docs\inbox   # 研报 drop-in 目录
  external_opinion_label: 外部观点      # 治理红线：研报一律标注外部观点
