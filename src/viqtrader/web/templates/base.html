<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VIQTrader 控制台{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="topnav">
  <span class="brand">VIQTrader</span>
{% set nav = [
    ("value", "/value", "价值链"),
    ("swing", "/swing", "波段链"),
    ("alerts", "/alerts", "告警中心"),
    ("params", "/params", "参数编辑"),
  ] %}
  {% for key, href, label in nav %}
  <a href="{{ href }}" class="{{ 'active' if active_page == key else '' }}">{{ label }}</a>
  {% endfor %}
</nav>
<main class="content">
{% block content %}{% endblock %}
</main>
</body>
</html>
